# Spring 2027 schedule — one entry per seminar Wednesday.
#
# Ten Wednesdays, March 31 through June 2, 2027 (June 2 is the last day of
# classes). Memorial Day (May 31) is a Monday, so every week meets. Bookings
# availability matches: Wednesdays 4:30–5:30 pm from 3/31 to 6/2, then closed
# for the summer.
#
# To add a confirmed speaker: replace the `tba: true` entry for that date
# with a filled-in block (see speakers/_template.yml), and drop a square-ish
# photo into images/speakers/ (e.g. images/speakers/jane-doe.jpg).
#
# Fields: date (ISO, used for sorting), display_date, then either
# `tba: true` or speaker details (name, url, affiliation, title,
# abstract, bio, photo).
#
# Room: the seminar meets in CoDA E160 unless an entry says otherwise. Add
# `location:` ONLY to an entry that meets somewhere else — the templates then
# flag that card and the home page's "Up next" block with a "different room"
# notice, so leaving the field off is what says "the usual room". Optional
# `location_url:` overrides the default campus-map link for that room.
#
# `title` and `abstract` use folded block scalars (`>-`). Inside one of those
# you write plain text with no escaping at all: straight quotes, apostrophes,
# colons, and LaTeX backslashes are all literal. Only the indentation matters,
# so keep every continuation line at the same depth. Never start a line with
# extra indentation inside a `>-` block — that turns it literal.
#
# If a title contains math that would look wrong outside the website (in a
# calendar entry or an email), add a `title_plain:` with a math-free version.

